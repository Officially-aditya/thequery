name: Normalize glossary data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deduplicate glossary by slug
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/glossary.json')
          terms = json.loads(path.read_text())

          # Keep the last definition for duplicate slugs. The most recently
          # consolidated entries are the detailed versions requested for the
          # new distributed-systems glossary terms.
          by_slug = {}
          order = []
          for term in terms:
              slug = term['slug'].strip()
              term['slug'] = slug
              if slug not in by_slug:
                  order.append(slug)
              by_slug[slug] = term

          normalized = [by_slug[slug] for slug in order]
          normalized.sort(key=lambda t: t['name'].casefold())
          path.write_text(json.dumps(normalized, indent=2, ensure_ascii=False) + '\n')
          print(f'Normalized {len(terms)} entries to {len(normalized)} unique slugs')
          PY

      - name: Remove temporary normalization workflow
        run: rm -f .github/workflows/normalize-glossary.yml

      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/glossary.json .github/workflows/normalize-glossary.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize glossary entries [skip ci]"
          git push
