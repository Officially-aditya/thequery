name: Restore detailed glossary entries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-glossary-detail.yml'

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[glossary-detail-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore glossary entries
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cat > /tmp/restore_glossary.py <<'PY'
          import json
          from pathlib import Path

          path = Path('data/glossary.json')
          terms = json.loads(path.read_text())

          entries = [
            {
              "name": "Rate Limiting", "slug": "rate-limiting", "category": "Distributed Systems",
              "shortDef": "A mechanism that controls how quickly a client, user, or service can consume an API or other shared resource, protecting capacity and enforcing quotas.",
              "fullDef": "## What rate limiting actually does\n\nRate limiting is an admission-control mechanism. It defines how much work a caller is allowed to start over some period instead of allowing every request to compete for resources immediately. The limit may be expressed as requests per second, requests per minute, tokens per minute, concurrent requests, bytes per second, or another unit that maps to the scarce resource.\n\nThe important idea is that a service has finite capacity. Rate limiting turns that capacity into an explicit contract at the edge of the system so that overload is handled deliberately rather than by letting queues, memory usage, database connections, or worker pools grow until something fails.\n\n## Common algorithms\n\nA **fixed-window** limiter counts requests in discrete intervals, such as one minute. It is easy to implement, but it can allow a burst at the boundary between two windows. A **sliding-window** design reduces that boundary effect by considering a moving interval.\n\nA **token bucket** starts with a number of tokens and replenishes them at a configured rate. Each request consumes one or more tokens. This lets a client make a controlled burst up to the bucket capacity while preserving a long-term average rate. A **leaky bucket** instead behaves more like a queue with a controlled output rate, smoothing bursts more aggressively.\n\nThere is also a distinction between rate and concurrency. A caller can remain below a request-per-second limit while keeping thousands of expensive requests in flight. Concurrency limits therefore complement rate limits by bounding work that has already entered the system.\n\n## Where the limit is enforced\n\nRate limits can be enforced at an API gateway, reverse proxy, application server, service mesh, or directly inside an expensive subsystem. A public API may limit by API key, user, tenant, IP address, endpoint, model, or combinations of these dimensions. A multi-tenant platform often needs separate quotas so that one customer cannot consume the entire shared capacity pool.\n\nIn a distributed deployment, independent per-instance counters can accidentally multiply the effective limit. A ten-instance service with a local limit of 100 requests per second per instance can admit roughly 1,000 requests per second unless the architecture intentionally wants that behavior. Shared state, partitioned limits, or approximate distributed algorithms are used when a global quota is required.\n\n## What happens when the limit is exceeded\n\nHTTP APIs commonly respond with **429 Too Many Requests**. A useful implementation can include a `Retry-After` hint or equivalent metadata so a client knows that the rejection is temporary. The system should also record throttled requests separately from application errors; otherwise operators may misread deliberate load shedding as a software failure.\n\n## Rate limiting is not overload protection by itself\n\nRate limiting protects the boundary, but it does not automatically protect every downstream resource. One request may be cheap while another triggers a long-running database query or a large model generation. Production systems therefore combine rate limits with concurrency limits, timeouts, backpressure, queue bounds, and autoscaling.\n\n## Example: an AI inference API\n\nSuppose a model provider allows a tenant 60 requests per minute and 8 concurrent generations. The request-rate limit protects the tenant's quota while the concurrency limit protects GPU memory and worker slots. When the tenant exceeds the request budget, the gateway returns 429. When all eight generation slots are occupied, additional requests wait briefly or are rejected according to the service's overload policy.\n\n## The core idea\n\nRate limiting makes resource consumption **explicit and bounded**. It is most effective when the limit is tied to the real bottleneck and combined with the rest of the system's capacity controls.",
              "relatedTerms": ["backpressure", "api-gateways", "throughput", "retry-timeout-strategies"],
              "seoDescription": "Rate limiting controls how quickly clients can consume APIs and shared resources, protecting capacity, enforcing quotas, and preventing overload.",
              "seoKeywords": ["what is rate limiting", "API rate limiting", "token bucket rate limiter", "HTTP 429", "distributed rate limiting"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like a nightclub controlling how quickly people enter so the room never fills faster than the staff can safely serve it."
            },
            {
              "name": "Kubernetes", "slug": "kubernetes", "category": "Infrastructure",
              "shortDef": "An open-source orchestration system that schedules and manages containerized workloads across a cluster, handling placement, health, networking, and lifecycle automation.",
              "fullDef": "## What Kubernetes is\n\nKubernetes is a container orchestration system built around a **declarative control model**. Instead of telling the platform exactly which server should run a container, an operator describes the desired state: for example, three replicas should exist, they should use a particular image, and they should be reachable through a stable service endpoint. Kubernetes continuously reconciles the observed state toward that desired state.\n\n## Core objects\n\nA **Pod** is the basic scheduling unit and can contain one or more tightly coupled containers. A **Deployment** manages replicated, replaceable application Pods and performs rolling updates. A **Service** provides stable networking in front of changing Pods. **ConfigMaps** and **Secrets** expose configuration and credentials. Other controllers such as StatefulSets and Jobs model workloads with different lifecycle requirements.\n\nThe scheduler chooses nodes for Pods using resource requests, constraints, taints, affinity rules, and other policies. The kubelet on each node starts the assigned containers and reports their state back to the control plane. Controllers then react to failures, configuration changes, and deployment updates.\n\n## Why the reconciliation model matters\n\nThe key conceptual leap is that Kubernetes is not merely a container launcher. It is a system of **controllers continually correcting drift**. If a Pod crashes and the desired state still says three replicas should exist, the control loop creates a replacement. If a rollout specifies a new image, the Deployment controller gradually moves the system toward that version.\n\n## Scaling and scheduling\n\nKubernetes can scale workloads horizontally and can schedule them according to CPU, memory, accelerator availability, topology, or custom constraints. For model serving, these controls can be used to place GPU workers, keep multiple replicas alive, or scale a deployment when queue depth or another custom signal changes.\n\nThe platform does not eliminate capacity planning. A new Pod may still need an image pull, model load, GPU initialization, and cache warm-up before it can serve real traffic. Scaling the number of desired replicas is therefore different from having immediately usable serving capacity.\n\n## Trade-offs\n\nKubernetes introduces a substantial operational surface: a control plane, networking, scheduling decisions, resource policies, upgrades, observability, and security configuration. A small application may be simpler on a managed platform or a single VM. Kubernetes becomes more valuable when the organization needs repeatable orchestration across many services and environments.\n\n## Example: model serving\n\nA company can run an inference Deployment with several GPU-backed Pods, expose them through a Service, and use readiness probes so traffic goes only to workers that have successfully loaded the model. An autoscaler can change the replica count as demand changes.\n\n## The core idea\n\nKubernetes is a **declarative reconciliation system for operating workloads at cluster scale**. The YAML is only the surface; the important abstraction is continuously steering infrastructure toward a declared desired state.",
              "relatedTerms": ["autoscaling", "api-gateways", "observability", "multi-region-serving"],
              "seoDescription": "Kubernetes is a declarative container orchestration platform for scheduling, scaling, networking, and healing workloads across clusters.",
              "seoKeywords": ["what is Kubernetes", "Kubernetes explained", "container orchestration", "Kubernetes scheduler", "Kubernetes deployments"],
              "lastUpdated": "2026-08-20",
              "analogy": "A warehouse manager that keeps placing, replacing, and routing inventory until the warehouse matches the plan you declared."
            },
            {
              "name": "Autoscaling", "slug": "autoscaling", "category": "Infrastructure",
              "shortDef": "The automatic adjustment of compute capacity in response to changing workload demand, balancing performance, availability, and infrastructure cost.",
              "fullDef": "## What autoscaling does\n\nAutoscaling is a feedback loop that changes the amount of serving capacity as workload demand changes. A scaler observes one or more signals—request rate, CPU utilization, memory pressure, queue depth, active requests, accelerator utilization, or a custom saturation metric—and adjusts capacity accordingly.\n\nThe goal is not simply to make a system bigger when traffic rises. It is to keep enough spare capacity to absorb demand without paying for a permanently oversized fleet.\n\n## Horizontal vs vertical scaling\n\n**Horizontal scaling** changes the number of instances or workers. It is often the natural choice for stateless services because requests can be distributed among replicas. **Vertical scaling** changes the resources available to an instance, such as CPU, memory, or GPU capacity.\n\nHorizontal scaling is constrained by startup time and the ability to distribute work. Vertical scaling can simplify some workloads but eventually hits a machine-size ceiling and can make failures larger because more capacity is concentrated in one instance.\n\n## Choosing the right signal\n\nCPU is a poor autoscaling signal when the real bottleneck is queue depth, GPU memory, or active model generations. Queue depth can be a strong signal for asynchronous processing because it directly measures work waiting for consumers. Concurrency is useful when a service has a hard limit on the number of operations that can be active before latency rises sharply.\n\nLatency can be used as an outcome signal, but scaling directly from noisy tail latency can create unstable feedback loops. The best metric is usually close to the resource's actual saturation point.\n\n## Why scaling is not instantaneous\n\nA new VM or Pod may take time to schedule, download an image, initialize a model, allocate GPU memory, and warm caches. That means autoscaling reacts after demand has already changed. Systems with bursty traffic may need minimum warm capacity, prewarming, predictive scaling, or queue buffering to bridge this gap.\n\nScale-down is deliberately slower in many systems. Removing capacity too aggressively can cause oscillation: scale out, scale in, scale out again. Stabilization windows and cooldown periods smooth the control loop.\n\n## Example: AI inference\n\nImagine a model server that can sustain 30 concurrent generations per GPU. When active concurrency stays above 24 for several evaluation periods, the autoscaler adds another worker. When concurrency drops for a sustained interval, it removes one. The threshold is intentionally below hard saturation so the new worker can become ready before the existing fleet hits its limit.\n\n## The core idea\n\nAutoscaling is **capacity control through feedback**. It works when the observed signal reflects true saturation and when the system accounts for the delay between requesting more capacity and that capacity becoming usable.",
              "relatedTerms": ["kubernetes", "throughput", "p99-tail-latency", "backpressure"],
              "seoDescription": "Autoscaling automatically changes compute capacity as demand changes, balancing latency and availability against infrastructure cost and scaling delay.",
              "seoKeywords": ["what is autoscaling", "horizontal autoscaling", "Kubernetes HPA", "queue based autoscaling", "AI inference autoscaling"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like opening more checkout counters as the line grows, while remembering that a new cashier still needs time to arrive and get ready."
            },
            {
              "name": "Backpressure", "slug": "backpressure", "category": "Distributed Systems",
              "shortDef": "A mechanism by which a slower downstream component signals an upstream producer to reduce or pause work, preventing queues and resources from growing without bound.",
              "fullDef": "## What backpressure means\n\nBackpressure appears when a producer can generate work faster than a consumer can safely process it. Instead of allowing an unbounded buffer to absorb the difference, the downstream component communicates that its capacity is being exhausted and the upstream component slows, pauses, or rejects new work.\n\nWithout backpressure, excess work accumulates somewhere: memory grows, queues get longer, threads block, connections remain open, or requests wait until the system eventually fails.\n\n## Common forms\n\nA bounded queue is a simple form of backpressure: once it reaches capacity, the producer must wait, drop work, or reject the item. Streaming protocols can expose demand or flow-control windows. Synchronous APIs can propagate pressure through blocking, cancellation, 429 responses, or overload errors.\n\nTCP itself has flow-control mechanisms that prevent a sender from overwhelming a receiver's buffers, which illustrates the general principle: the consumer's ability to accept data limits the producer's ability to send it.\n\n## Backpressure vs rate limiting\n\nRate limiting is usually a **policy-defined budget**: a caller is allowed a certain amount of work regardless of instantaneous downstream pressure. Backpressure is **state-dependent flow control**: the consumer is saying that its current capacity is insufficient, so upstream production must change.\n\nA production system can use both. Rate limiting protects shared capacity from excessive callers; backpressure prevents active pipelines from flooding a bottleneck that is already saturated.\n\n## Bounded queues and controlled degradation\n\nA queue should usually have a meaningful upper bound. Once the bound is reached, the system needs a policy: reject low-priority work, shed load, sample events, slow producers, or return a visible overload response. Infinite buffering often makes an outage worse by turning failure into unbounded latency.\n\n## Example: streaming model output\n\nSuppose a client reads generated tokens more slowly than the model server produces them. The streaming layer cannot safely buffer unlimited tokens in memory. It therefore applies flow control or pauses the producer until downstream buffers have room again.\n\n## The core idea\n\nBackpressure is how a pipeline says **\"you are producing faster than I can consume\"**. It keeps overload visible and bounded instead of hiding it inside ever-growing buffers.",
              "relatedTerms": ["streaming-sse", "message-queues", "rate-limiting", "retry-timeout-strategies"],
              "seoDescription": "Backpressure prevents overloaded consumers from being overwhelmed by controlling how quickly upstream systems produce work.",
              "seoKeywords": ["what is backpressure", "backpressure distributed systems", "stream backpressure", "bounded queues", "backpressure in APIs"],
              "lastUpdated": "2026-08-20",
              "analogy": "A kitchen that stops accepting new orders when the cooks are overwhelmed instead of stacking tickets until the whole restaurant collapses."
            },
            {
              "name": "Streaming / SSE", "slug": "streaming-sse", "category": "Distributed Systems",
              "shortDef": "A way to deliver partial results progressively over a long-lived connection; Server-Sent Events (SSE) is an HTTP-based pattern where the server pushes a sequence of events to a client.",
              "fullDef": "## What streaming changes\n\nA traditional API response says: **do all the work, then return the result**. A streaming API changes the contract to **return useful pieces as soon as they are ready**. This matters when the complete operation takes seconds or minutes but the user can benefit from partial progress immediately.\n\nAI text generation is a common example. Instead of waiting for the full completion, the server can send tokens or chunks as the model generates them. This reduces perceived latency even when total completion time remains unchanged.\n\n## Server-Sent Events\n\nSSE is a simple HTTP mechanism for one-way server-to-client streaming. The browser opens a long-lived connection, commonly requesting `text/event-stream`, and the server emits a sequence of events. Each event can include data, an event name, an identifier, and retry information.\n\nSSE is **unidirectional**. The server pushes events to the client; the client generally sends separate HTTP requests when it needs to provide additional input. This is different from WebSockets, which provide bidirectional messaging over a persistent connection.\n\n## Why SSE works well for AI interfaces\n\nSSE fits naturally into browser-facing HTTP infrastructure. A chat application can keep the normal HTTPS request model while incrementally sending generated text. There is less protocol machinery than a full bidirectional socket, and reconnection behavior is straightforward to implement.\n\nThe trade-off is that streaming connections live much longer than ordinary API requests. Reverse proxies can buffer chunks, idle timeouts can terminate quiet connections, and infrastructure must handle cancellation when users navigate away or stop generation.\n\n## Operational concerns\n\nA streaming service should define heartbeat behavior, flush semantics, maximum connection duration, cancellation propagation, and reconnect behavior. Gateways and load balancers must be configured so they do not buffer the output that the application intends to stream.\n\nFor generated content, the client also needs to treat the stream as a sequence that may end unexpectedly. It should know how to reconstruct partial state and distinguish a clean completion from a network disconnect.\n\n## Example\n\nA browser sends a prompt to `/api/chat`. The backend calls a model server, receives generated chunks, and forwards them over SSE. The UI appends each `data:` event to the visible answer. If the user presses Stop, the browser closes the stream and the server propagates cancellation to the model worker.\n\n## The core idea\n\nStreaming is fundamentally about **time-to-first-useful-result**, while SSE is one practical HTTP transport for doing it from server to client.",
              "relatedTerms": ["backpressure", "grpc", "retry-timeout-strategies", "p99-tail-latency"],
              "seoDescription": "Streaming APIs return data incrementally, while SSE provides an HTTP-based mechanism for pushing server events over a long-lived connection.",
              "seoKeywords": ["what is SSE", "Server-Sent Events explained", "streaming API", "LLM streaming", "SSE vs WebSockets"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like receiving each course of a meal as soon as it is cooked instead of waiting for the kitchen to finish the entire meal."
            },
            {
              "name": "Retry / Timeout Strategies", "slug": "retry-timeout-strategies", "category": "Distributed Systems",
              "shortDef": "A set of failure-handling policies that limit how long a request may wait and determine when transient failures should be retried, cancelled, or surfaced to the caller.",
              "fullDef": "## Why timeouts and retries belong together\n\nDistributed calls can fail because a dependency is down, slow, overloaded, unreachable, or successful but invisible to the caller because the response was lost. **Timeouts bound waiting. Retries attempt recovery.** Both need explicit budgets.\n\n## Timeout design\n\nA system may have separate connect, read, and overall request timeouts, but the most important concept is the **deadline**: the original caller has a finite amount of time for the entire operation. Downstream services should not invent a fresh timeout that exceeds the remaining budget.\n\nSuppose an API request has 800 ms remaining after authentication and retrieval. If the model service is given a five-second timeout, it can continue consuming resources long after the user-facing request has already become hopeless. Deadline propagation keeps the call chain aligned.\n\n## Retry policy\n\nRetries are appropriate mainly for **transient and idempotent** failures. A failed GET can often be retried safely. A payment, reservation, or job submission may require an idempotency key because the first attempt might already have succeeded even though the client did not receive the response.\n\nCommon retry strategies use exponential backoff with jitter. Exponential backoff increases the delay between attempts; jitter randomizes those delays so thousands of clients do not retry simultaneously and create a thundering herd.\n\n## Retry storms\n\nThe dangerous case is an overloaded dependency that responds slowly. Clients time out, retry, and thereby send more traffic to the same overloaded service. This raises load, increases latency, triggers more timeouts, and can create a cascading failure.\n\nProduction systems therefore cap retries, impose total retry budgets, respect server-provided retry hints, and often combine retries with circuit breaking, rate limits, concurrency bounds, and backpressure.\n\n## Example\n\nA gateway gives a model service 1.5 seconds of the user's total 2-second deadline. If a request fails with a transient network error, it may make one retry after jittered backoff. The retry still must fit inside the original deadline. If the service returns a non-retryable validation error, the gateway surfaces it immediately rather than consuming the remaining budget.\n\n## The core idea\n\nTimeouts decide **how long the system is willing to wait**. Retries decide **when another attempt is worth its cost**. Both are capacity controls, not generic cures for failures.",
              "relatedTerms": ["rate-limiting", "backpressure", "p99-tail-latency", "observability"],
              "seoDescription": "Timeouts bound waiting time and retries recover from transient failures, but both must be designed to avoid retry storms and cascading overload.",
              "seoKeywords": ["retry strategy distributed systems", "exponential backoff jitter", "API timeouts", "retry storm", "deadline propagation"],
              "lastUpdated": "2026-08-20",
              "analogy": "A timeout is deciding when to stop waiting for a late train; a retry is deciding whether catching the next train is worth the extra trip and congestion."
            },
            {
              "name": "Observability", "slug": "observability", "category": "Infrastructure",
              "shortDef": "The practice of instrumenting a system so operators can infer its internal behavior from emitted telemetry, especially metrics, logs, and traces.",
              "fullDef": "## What observability means\n\nObservability is the ability to infer what a running system is doing from the evidence it emits. The three common telemetry signals are **metrics, logs, and traces**. Metrics summarize behavior numerically, logs capture discrete events and context, and traces show how one request moved through the system.\n\nThe goal is not to produce the maximum amount of telemetry. The goal is to answer useful questions when behavior is unfamiliar: What changed? Which requests are affected? Which tenant, region, model, or dependency is responsible? Where is time being spent?\n\n## Metrics\n\nMetrics reveal rates, errors, saturation, and distributions. Useful production signals can include request rate, error rate, queue depth, active concurrency, CPU/GPU utilization, cache hit rate, model load time, token counts, time to first token, and tail latency.\n\nA single average often hides important behavior. For example, a service can have excellent average latency while a small fraction of requests takes several seconds. Percentiles and histograms expose that tail.\n\n## Logs\n\nStructured logs make discrete events searchable and machine-readable. Request IDs, tenant IDs, endpoint names, error classes, and model identifiers can connect logs to higher-level telemetry. Care is required with sensitive data: raw prompts, tokens, credentials, and personal data should not be emitted casually.\n\n## Traces\n\nDistributed tracing follows an individual request across service boundaries. It shows whether latency came from authentication, an API gateway, a queue, a database, a model server, or a downstream dependency. Traces become especially valuable in fan-out architectures where one slow child operation can dominate the final response.\n\n## Observability for AI systems\n\nAI serving introduces metrics that ordinary web services may not need: tokens per second, queue time, batch size, time to first token, inter-token delay, accelerator memory pressure, model load duration, and cancellation rate. These signals distinguish compute saturation from queueing and distinguish model execution time from transport overhead.\n\n## Good observability is actionable\n\nA dashboard is useful when it helps an engineer decide what to do next. An alert is useful when it identifies a condition that deserves intervention. High-cardinality labels can be powerful for slicing by tenant or model, but they also increase storage and query cost.\n\n## The core idea\n\nObservability is the system's **ability to explain its own behavior through telemetry**. Metrics tell you what changed, logs provide event context, and traces explain where a request spent its time.",
              "relatedTerms": ["distributed-tracing", "p99-tail-latency", "throughput", "retry-timeout-strategies"],
              "seoDescription": "Observability uses metrics, logs, and traces to make distributed systems understandable in production and speed up failure diagnosis.",
              "seoKeywords": ["what is observability", "metrics logs traces", "AI serving observability", "OpenTelemetry observability", "production debugging"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like putting gauges, cameras, and a black box into a machine so you can reconstruct what happened inside after something goes wrong."
            },
            {
              "name": "Distributed Tracing", "slug": "distributed-tracing", "category": "Infrastructure",
              "shortDef": "A technique for following an individual request across multiple services and recording the timing and relationships of the work performed at each hop.",
              "fullDef": "## Trace and span\n\nA distributed trace represents one logical operation across many services. It is composed of **spans**, where each span represents a bounded unit of work such as an API gateway call, database query, queue wait, or model inference.\n\nA trace has an identifier that is propagated between services. Parent-child relationships between spans preserve the path of the request, allowing operators to reconstruct not just what happened, but how long each stage took.\n\n## Why tracing matters\n\nSuppose an API request takes 2 seconds. A server-level latency metric alone does not tell you whether the time was spent waiting in a queue, calling a database, communicating with another service, loading a model, or actually generating tokens. The trace breaks the 2 seconds into those components.\n\nTracing is also powerful for **fan-out**. If one request calls ten downstream services in parallel, the end-to-end latency is often determined by the slowest branch. A trace makes that relationship visible.\n\n## Context propagation\n\nFor tracing to work across service boundaries, trace context has to travel with the request. Standardized headers or instrumentation libraries propagate the trace identifier and parent span so downstream components can attach their work to the same trace.\n\n## Sampling\n\nTracing every request can be expensive at high scale. Systems therefore use sampling strategies. Head-based sampling makes the decision early; tail-based sampling can keep traces that turn out to be errors or unusually slow after the complete trace is known.\n\nSampling should be designed so rare failures are not accidentally discarded. Many systems dynamically preserve errors and high-latency traces at a higher rate than routine successful traffic.\n\n## Security and data hygiene\n\nTracing metadata should help explain system behavior without becoming a second copy of sensitive application data. API keys, credentials, private prompts, and customer content should not be placed into spans casually.\n\n## Example\n\nA request arrives at an edge gateway, which creates the root span. The gateway calls an auth service, then a scheduler, which waits 120 ms in a queue before calling a GPU worker. The GPU worker records model execution time and streams results back. The final trace shows exactly where the latency accumulated.\n\n## The core idea\n\nDistributed tracing is **request-level observability across service boundaries**. It turns an opaque multi-service latency number into a causal timeline of work.",
              "relatedTerms": ["observability", "p99-tail-latency", "api-gateways", "grpc"],
              "seoDescription": "Distributed tracing follows requests across services with spans and trace context, making cross-service latency and failures visible.",
              "seoKeywords": ["what is distributed tracing", "OpenTelemetry tracing", "trace and span", "microservices tracing", "request tracing"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like attaching a tracking number to a package at every handoff so you can see every warehouse and truck it passed through before delivery."
            },
            {
              "name": "P99 / Tail Latency", "slug": "p99-tail-latency", "category": "Infrastructure",
              "shortDef": "A way to describe slow-end request latency; P99 is the latency value at which 99% of requests are faster and roughly 1% are slower.",
              "fullDef": "## What P99 means\n\nP99 is the 99th percentile of a latency distribution. If a service reports a P99 of 800 ms, roughly 99% of observed requests completed in 800 ms or less and about 1% were slower. It is therefore a measure of the slow tail rather than the typical request.\n\nOther useful percentiles are P50 (median), P90, P95, and P99.9. The farther into the tail you go, the more sensitive the measurement becomes to rare events such as queueing, garbage collection, cold starts, packet loss, retries, and overloaded dependencies.\n\n## Why the average can lie\n\nA service can have a 100 ms average while its P99 is 4 seconds. That means the majority of requests look excellent while a significant minority are painfully slow. Interactive systems often care about the tail because users experience individual requests, not the arithmetic average.\n\n## Fan-out amplifies tails\n\nIn a distributed system, one user request may depend on many downstream operations. Even if each dependency is usually fast, the chance that at least one child lands in its slow tail grows as the number of dependencies increases. The slowest branch can determine the end-to-end latency. This is one reason distributed tracing and careful deadline propagation matter.\n\n## P99 is not an upper bound\n\nP99 does not mean \"requests will never exceed this value.\" One percent of observations are beyond it by definition. It is a percentile, not a hard safety limit. Percentiles also should not be averaged casually across servers or windows; histogram-based or mergeable distribution methods are safer for aggregation.\n\n## AI serving needs multiple latency measures\n\nFor generative models, total completion time is only one dimension. **Time to first byte**, **time to first token**, **inter-token delay**, and **time to final token** can tell very different stories. A model can have an excellent time-to-first-token while generating the rest too slowly.\n\n## Example\n\nAn inference service reports P50 time-to-first-token of 180 ms and P99 of 1.6 seconds. The average alone might suggest the service is healthy. A trace of the slow tail could reveal that the P99 requests are spending most of their time waiting in a full GPU queue rather than in model computation.\n\n## The core idea\n\nTail latency measures the **unlucky requests that sit near the slow end of the distribution**. P99 is useful because it exposes user-visible performance problems that an average can hide.",
              "relatedTerms": ["throughput", "observability", "distributed-tracing", "autoscaling"],
              "seoDescription": "P99 is a latency percentile used to reason about slow-end behavior and tail latency in distributed systems where averages can hide painful outliers.",
              "seoKeywords": ["P99 latency explained", "tail latency", "latency percentiles", "P99 vs average latency", "LLM tail latency"],
              "lastUpdated": "2026-08-20",
              "analogy": "The average tells you how most cars travel; P99 tells you what the unlucky drivers near the back of the traffic jam are experiencing."
            },
            {
              "name": "Throughput", "slug": "throughput", "category": "Infrastructure",
              "shortDef": "The amount of useful work a system completes per unit time, such as requests per second, tokens per second, messages per second, or transactions per second.",
              "fullDef": "## What throughput measures\n\nThroughput is the rate at which a system successfully completes useful work. The unit should describe what counts as work: requests per second, tokens per second, messages per second, transactions per second, or jobs per minute.\n\nThroughput is different from latency. Latency asks how long one operation takes; throughput asks how much completed work the system can sustain over time. A system can have low latency for small individual requests but poor throughput because it cannot process many requests concurrently.\n\n## Finding the bottleneck\n\nThroughput is limited by the system's current bottleneck. Depending on the workload, the limiting resource may be CPU, GPU compute, GPU memory, memory bandwidth, disk I/O, network bandwidth, database connections, or an external dependency. Once the bottleneck saturates, feeding the system more work tends to create queueing rather than more useful throughput.\n\nThis is why performance testing should measure the throughput-versus-latency curve instead of looking for one maximum requests-per-second number. Often, throughput continues to rise until a resource approaches saturation, after which latency starts increasing rapidly.\n\n## Batching and AI inference\n\nBatching can increase throughput by amortizing fixed overhead and improving accelerator utilization. Processing eight requests together may be much more efficient than running eight tiny kernel launches separately. The trade-off is waiting: the system may need to hold the earliest request briefly while enough work accumulates to form a useful batch.\n\nDynamic batching attempts to find a balance by collecting requests for a small scheduling interval and dispatching a batch once it reaches a target size or deadline. Larger batches can increase throughput while worsening tail latency and memory pressure.\n\n## Throughput is not acceptance\n\nA service that accepts 10,000 requests per second but drops 20% of them does not have the same useful throughput as one that successfully completes all 10,000. In production, throughput should therefore be read alongside error rate, queue depth, latency, and saturation.\n\nThe same distinction appears in asynchronous systems. A queue may ingest messages much faster than workers process them. Input rate is not throughput; completed work is.\n\n## Example\n\nA model server processes 40,000 tokens per second across four GPUs. Increasing concurrency to the point where queue depth grows does not necessarily increase useful throughput. If the GPUs were already saturated, additional concurrency may simply increase waiting time. The productive capacity was already near the bottleneck.\n\n## The core idea\n\nThroughput answers how much useful work a system can finish per unit time. Capacity planning becomes meaningful when throughput is considered together with latency and the resources that constrain it.",
              "relatedTerms": ["p99-tail-latency", "autoscaling", "backpressure", "message-queues"],
              "references": [{"title": "Google Cloud Architecture Center", "url": "https://cloud.google.com/architecture"}],
              "seoDescription": "Throughput measures completed work per unit time and is a core capacity metric for APIs, queues, databases, and AI inference systems.",
              "seoKeywords": ["what is throughput", "requests per second", "AI inference throughput", "throughput vs latency", "system capacity"],
              "lastUpdated": "2026-08-20",
              "analogy": "If latency is how long one package spends in a warehouse, throughput is how many packages the warehouse successfully ships every minute."
            },
            {
              "name": "API Gateways", "slug": "api-gateways", "category": "Distributed Systems",
              "shortDef": "A network entry point that sits in front of backend services and centralizes cross-cutting concerns such as routing, authentication, rate limiting, transformation, and observability.",
              "fullDef": "## What an API gateway is\n\nAn API gateway is the controlled front door to a collection of backend services. Instead of every client knowing which internal service owns which endpoint, the client talks to the gateway and the gateway routes the request to the appropriate backend. This creates a centralized place for policies that should apply consistently across many APIs.\n\n## Responsibilities\n\nA gateway may terminate TLS, authenticate requests, enforce rate limits, validate headers, perform request routing, attach correlation IDs, collect telemetry, transform protocols, and sometimes aggregate calls to several downstream services. It can also hide internal topology from clients, allowing services to move or scale without changing public URLs.\n\n## Gateway vs load balancer\n\nThe two roles overlap in many products but are conceptually different. A load balancer primarily distributes traffic across healthy backends. An API gateway usually understands API-level concerns such as routes, identities, quotas, authentication, transformations, and policies. Modern infrastructure products can perform both roles, but the architectural responsibilities remain distinct.\n\n## The downside of centralization\n\nA gateway can simplify dozens of services while simultaneously becoming a critical failure point. If the gateway is overloaded, every service behind it appears unhealthy. Heavy business logic in the gateway also creates a central bottleneck and makes deployments risky. A good rule is to keep the gateway focused on transport and policy, while domain logic remains in the backend services that own it.\n\nStreaming introduces another set of constraints. An API gateway that buffers responses or enforces an ordinary 30-second idle timeout can break SSE token streaming even though the backend works correctly. Gateways must therefore understand long-lived connections, cancellation, and flush semantics.\n\n## Example\n\nA public AI platform might expose `/v1/chat` through a gateway. The gateway authenticates the API key, checks tenant quotas, attaches a trace ID, chooses a healthy inference cluster, and returns either a normal response or an SSE stream. The actual model workers remain private and can scale independently behind the gateway.\n\n## The core idea\n\nAn API gateway is a policy and routing boundary. It hides internal topology and gives clients one stable entry point while centralizing concerns that would otherwise be repeated across services.",
              "relatedTerms": ["rate-limiting", "observability", "grpc", "iam-secrets"],
              "seoDescription": "API gateways provide a single entry point for backend services and centralize routing, authentication, rate limiting, and other API policies.",
              "seoKeywords": ["what is an API gateway", "API gateway explained", "API gateway vs load balancer", "API gateway rate limiting", "gateway architecture"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like a building reception desk that checks credentials, directs visitors to the right room, records entries, and enforces building-wide rules."
            },
            {
              "name": "gRPC", "slug": "grpc", "category": "Distributed Systems",
              "shortDef": "A high-performance remote procedure call framework that uses Protocol Buffers and HTTP/2 to provide strongly typed service-to-service communication, including streaming.",
              "fullDef": "## What gRPC is\n\ngRPC is a remote procedure call (RPC) framework. A service defines methods in a Protocol Buffers schema and client/server code can be generated from that contract. Calling a remote method can therefore look much closer to calling a local function while the framework handles serialization and transport.\n\n## Protocol Buffers\n\nA `.proto` file defines services, request messages, response messages, and field types. The schema is strongly typed and designed for efficient binary serialization. Generated code gives clients and servers a shared contract and helps catch incompatible changes before runtime.\n\nProtocol Buffers also provide a disciplined way to evolve schemas. Stable field numbers and compatibility rules matter when independent services are deployed on different schedules.\n\n## HTTP/2 and streaming\n\ngRPC commonly runs over HTTP/2, which provides multiplexed streams, binary framing, header compression, and long-lived connections. It supports unary calls as well as server streaming, client streaming, and bidirectional streaming.\n\nThese properties make gRPC attractive for service-to-service communication where typed APIs and efficient serialization matter. It is also useful for model orchestration, token services, schedulers, retrieval components, and internal inference APIs.\n\n## gRPC vs browser APIs\n\nBrowsers do not generally use ordinary gRPC directly, so browser-facing systems often use gRPC-Web or place an HTTP/JSON or SSE gateway in front of the service. A common architecture is therefore simple HTTP at the edge and gRPC inside the service network.\n\n## Operational concerns\n\nThe protocol does not remove distributed-systems problems. Teams still need explicit deadlines, cancellation, retries, load balancing, connection management, tracing, and backpressure. Long-lived HTTP/2 connections can also interact differently with proxies and middleboxes than short-lived HTTP/1.1 requests.\n\n## Example\n\nA chat gateway can call an internal inference scheduler over gRPC. The gateway sends a typed request containing the model, prompt metadata, and generation limits. The scheduler selects a worker and streams results back over gRPC. The public browser connection can then expose those results as SSE.\n\n## The core idea\n\ngRPC is valuable because it provides a strong contract and efficient transport for service-to-service communication while supporting streaming and generated client/server code.",
              "relatedTerms": ["api-gateways", "streaming-sse", "retry-timeout-strategies", "distributed-tracing"],
              "references": [{"title": "gRPC Documentation", "url": "https://grpc.io/docs/"}],
              "seoDescription": "gRPC is a strongly typed RPC framework built around Protocol Buffers and HTTP/2, supporting efficient unary and streaming service communication.",
              "seoKeywords": ["what is gRPC", "gRPC explained", "Protocol Buffers RPC", "gRPC vs REST", "gRPC streaming"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like replacing handwritten instructions between departments with a shared typed form that computers can validate and transmit efficiently."
            },
            {
              "name": "Message Queues", "slug": "message-queues", "category": "Distributed Systems",
              "shortDef": "A buffering and delivery mechanism that decouples producers from consumers by storing messages until downstream workers can process them.",
              "fullDef": "## What a message queue does\n\nA message queue lets one component produce work without requiring the consumer to be ready at the same instant. The producer places a message into a broker or queue, and a worker later consumes it. This decouples the timing and capacity of the two sides.\n\nQueues are useful for email delivery, document processing, indexing, background jobs, media processing, and batch inference. A burst of traffic can be absorbed temporarily instead of forcing producers to wait synchronously for every consumer.\n\n## Delivery semantics\n\nOne of the first design questions is what delivery guarantee the system needs. At-most-once delivery favors avoiding duplicates but can lose work. At-least-once delivery retries failed processing but requires consumers to tolerate duplicates. Systems that appear to provide exactly-once behavior often achieve it with transactions or application-level deduplication rather than a universal guarantee.\n\nOrdering is another concern. Some systems provide global ordering at high cost; others guarantee ordering only within partitions or keys. The application should define whether ordering is actually required.\n\n## Queues do not create capacity\n\nA queue can absorb a burst, but it cannot make a slow consumer faster. If producers add 10,000 messages per second and workers complete only 4,000, backlog grows. The queue has converted immediate overload into waiting time.\n\nThis is why queue depth, oldest-message age, consumer throughput, and queue capacity are important operational signals. An unbounded queue can quietly turn an outage into hours of accumulated latency.\n\n## Failure handling\n\nReal systems need policies for poisoned messages that repeatedly fail. A dead-letter queue can separate messages that exceed retry limits. Visibility timeouts, acknowledgements, leases, deduplication keys, and retention rules determine what happens when a worker crashes halfway through processing.\n\n## AI serving example\n\nAn inference scheduler can use a queue so it can batch similar requests, prioritize urgent work, and distribute jobs across available GPUs. If the queue becomes too deep, the system may autoscale more workers or reject low-priority requests.\n\nFor interactive workloads, however, the queue should have a clear latency budget. A user may prefer a fast overload response to a request that was accepted but will not run for several minutes.\n\n## The core idea\n\nA message queue is a buffer and decoupling layer. It separates producers from consumers and smooths bursts, but the queue itself has capacity, latency, delivery semantics, and failure modes that must be engineered explicitly.",
              "relatedTerms": ["backpressure", "throughput", "autoscaling", "observability"],
              "seoDescription": "Message queues decouple producers and consumers, absorb bursts, and enable asynchronous processing, but queue depth and delivery semantics must be managed carefully.",
              "seoKeywords": ["what is a message queue", "message broker explained", "Kafka queue architecture", "asynchronous processing", "dead letter queue"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like a mailroom holding packages between the people who receive them, allowing senders and recipients to work at different speeds without blocking each other."
            },
            {
              "name": "IAM / Secrets", "slug": "iam-secrets", "category": "Security",
              "shortDef": "The identity and credential controls that determine who can access resources and how sensitive values such as API keys, passwords, and signing keys are stored and delivered.",
              "fullDef": "## IAM and secrets solve different problems\n\nIdentity and Access Management (IAM) answers **who is allowed to do what**. Secrets management answers **how sensitive credentials are stored, rotated, audited, and delivered**. They work together, but treating them as one vague security feature hides important design decisions.\n\n## Least privilege\n\nIAM should follow the principle of least privilege: a workload gets only the permissions necessary for its job. A document worker that needs to read one storage bucket should not automatically have administrator access to the entire account.\n\nIdentities can represent humans, services, workloads, or federated external principals. Policies then define which actions are permitted on which resources. Workload identities and short-lived credentials are usually safer than permanent keys because compromise windows become smaller.\n\n## Secrets management\n\nSecrets include passwords, API tokens, private certificates, database credentials, webhook signing keys, and encryption material. They should not be committed to source control, baked into public container images, or copied into logs.\n\nA secrets manager can encrypt values at rest, restrict retrieval to authorized identities, record access, and support rotation. At runtime, secrets may be exposed through environment variables, mounted files, sidecars, or platform-native identity mechanisms. The design should minimize copies and make revocation practical.\n\n## Common failure modes\n\nA leaked API key is obvious, but broad permissions can be just as dangerous. If a compromised inference worker can read unrelated customer data, the blast radius is much larger than the original credential exposure.\n\nRotation is another operational problem. Long-lived credentials that nobody remembers how to rotate become permanent liabilities. Good systems make rotation routine rather than an emergency procedure.\n\nLogging is an easy leakage path: authorization headers, environment variables, request payloads, and error objects can accidentally contain credentials or sensitive data.\n\n## Example\n\nAn inference service may need permission to read model artifacts from one object-storage bucket and publish metrics. It should not need permission to change billing settings or read another team's database. Its workload identity provides the required access, while the remaining sensitive bootstrap material is retrieved from a secrets manager.\n\n## The core idea\n\nIAM controls **identity and authorization**. Secrets management controls **sensitive credentials**. Secure systems combine least privilege, strong identity, short credential lifetimes where possible, safe storage, rotation, and auditability.",
              "relatedTerms": ["api-gateways", "kubernetes", "observability", "multi-region-serving"],
              "seoDescription": "IAM controls identities and permissions, while secrets management protects credentials and sensitive values through secure storage, delivery, rotation, and auditing.",
              "seoKeywords": ["IAM explained", "secrets management", "least privilege", "workload identity", "API key security"],
              "lastUpdated": "2026-08-20",
              "analogy": "IAM is the building's access-control system; secrets management is the secure key cabinet that stores the keys those identities need."
            },
            {
              "name": "Multi-Region Serving", "slug": "multi-region-serving", "category": "Infrastructure",
              "shortDef": "Running a service in multiple geographic regions so requests can be routed to nearby or healthy capacity, improving resilience, latency, and sometimes regulatory control.",
              "fullDef": "## Why run multiple regions?\n\nMulti-region serving places production capacity in more than one geographic region. The goals can include lower network latency, regional failure isolation, data residency, capacity expansion, or some combination of these. Geographic placement matters because the speed of light and network routing impose a real round-trip cost on distant requests.\n\n## Stateless vs stateful systems\n\nStateless services are comparatively straightforward to replicate. Each region can run the same container image and model artifacts, and a global router can direct clients to healthy capacity. Model-serving fleets often fit this pattern well.\n\nStateful systems are harder. Data may need replication, conflict resolution, ordering, and consistency guarantees across regions. A global database does not automatically provide one global truth; the application still has to define what can be stale and how it behaves during network partitions.\n\n## Traffic routing\n\nRequests can be routed using DNS, global load balancers, anycast, or application-level routing. Health checks should test real serving capability rather than only process liveness. A model region can be technically reachable but unable to accept more GPU work. Capacity-aware routing therefore benefits from queue depth, concurrency, and saturation signals in addition to binary health.\n\n## Failover capacity\n\nA multi-region architecture only improves resilience if the remaining regions can absorb the failed region's workload. If each region is normally running at 80% utilization, losing one region may simply move the same overload to the survivors. Teams often maintain headroom or design explicit cross-region spillover capacity.\n\n## Operational complexity\n\nEvery region needs deployability, telemetry, credentials, model artifacts, rollback procedures, and incident response. Configuration drift can create region-specific bugs. Version skew matters too: failing over from one region to another is much safer when both can serve compatible requests and data formats.\n\n## Example: global AI inference\n\nUsers in India are normally routed to an Asia region with several warm GPU workers. European traffic goes to Europe. If the Asia region loses capacity, the router can spill traffic to another region. The fallback region must have sufficient model replicas and network paths; otherwise failover only moves the outage.\n\n## The core idea\n\nMulti-region serving is not simply **\"deploy twice\"**. It is a capacity, routing, state, and operational strategy for continuing to serve users when geography, latency, or regional failure changes the environment.",
              "relatedTerms": ["kubernetes", "autoscaling", "p99-tail-latency", "iam-secrets"],
              "seoDescription": "Multi-region serving places production capacity in multiple geographic regions for lower latency, resilience, and data or capacity requirements.",
              "seoKeywords": ["multi-region architecture", "multi-region serving", "global load balancing", "regional failover", "multi-region AI inference"],
              "lastUpdated": "2026-08-20",
              "analogy": "Like running the same emergency service from several cities so customers have a nearby station and one city's outage does not shut down the whole network."
            },
